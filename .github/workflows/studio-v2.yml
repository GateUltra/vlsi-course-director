name: Reproduce narrated course packs

on:
  push:
    paths: ['vlsi-html-course-studio/**', '.github/workflows/studio-v2.yml']
  pull_request:
    paths: ['vlsi-html-course-studio/**', '.github/workflows/studio-v2.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        working-directory: vlsi-html-course-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: vlsi-html-course-studio/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Preflight and domain checks
        run: |
          python scripts/studio.py doctor
          for pack in wirelength logic-timing; do
            python scripts/studio.py check --course "assets/course-packs/$pack" --audio-mode fixture
            node assets/runtime/check_core.mjs "assets/course-packs/$pack"
            python scripts/check_studio.py --course "assets/course-packs/$pack"
          done
      - name: Rebuild real narration without a speech service
        run: |
          for pack in wirelength logic-timing; do
            python scripts/studio.py build --course "assets/course-packs/$pack" --out "$RUNNER_TEMP/site-$pack" --audio-mode fixture --width 640 --height 360 --fps 15
            python scripts/studio.py verify --site "$RUNNER_TEMP/site-$pack" --course "assets/course-packs/$pack"
            python scripts/check_studio_browser.py --site "$RUNNER_TEMP/site-$pack" --report "$RUNNER_TEMP/browser-$pack.json"
            python scripts/check_studio.py --course "assets/course-packs/$pack" --site "$RUNNER_TEMP/site-$pack"
          done
      - name: Preserve reproduction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-pack-reproduction
          retention-days: 14
          path: |
            ${{ runner.temp }}/browser-*.json
            ${{ runner.temp }}/browser-*-screens/
            ${{ runner.temp }}/site-*/build-record.json
            ${{ runner.temp }}/site-*/review/
